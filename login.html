<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - LogicSpark</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236c3ce1%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220.5%22%20stop-color%3D%22%238b5cf6%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ec4899%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url(%23g)%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M36%208%20L16%2038%20h12%20L26%2056%20L46%2026%20h-12%20Z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
  </head>
<body>
  <nav class="auth-nav">
    <a href="index.html" class="nav-brand">
      <span class="logo-icon">&#9889;</span>
      <span class="brand-text">
        <span class="brand-name">LogicSpark</span>
        <span class="brand-credit">Developed by ARJUN M</span>
      </span>
    </a>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to continue your practice</p>
      </div>

      <div id="loginMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email or Username</label>
          <input type="text" id="loginEmail" placeholder="Enter your email or username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Log In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p style="margin-top: 8px;">Developed by ARJUN M</p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/particles.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('logicspark_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }

      const session = localStorage.getItem('logicspark_session');
      if (session) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const msgEl = document.getElementById('loginMessage');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearFieldErrors('loginForm');
        msgEl.innerHTML = '';

        const emailOrUsername = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!emailOrUsername) {
          showFieldError('loginEmail', 'Please enter your email or username.');
          return;
        }
        if (!password) {
          showFieldError('loginPassword', 'Please enter your password.');
          return;
        }

        disableButton(btn);

        try {
          await signIn(emailOrUsername, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          enableButton(btn);
          let msg = 'Login failed. Please check your credentials and try again.';
          if (err.message.includes('Invalid login')) {
            msg = 'Invalid email or password. Please try again.';
          } else if (err.message.includes('No account found')) {
            msg = 'No account found with that username.';
          } else if (err.message.includes('Email not confirmed')) {
            msg = 'Please confirm your email before logging in.';
          }
          msgEl.innerHTML = '<div class="form-message error">' + msg + '</div>';
        }
      });
    })();
  </script>
</body>
</html>
