    </ul>

  <main class="main-content has-bottom-nav">
    <div class="container">
      <!-- Quiz Config Screen -->
      <div id="quizConfig">
        <h1 class="page-title">Practice Quiz</h1>
        <p class="page-subtitle">Configure your quiz and start practicing</p>

        <div class="quiz-config card">
          <div class="config-option">
            <label for="selectCategory">Category</label>
            <select id="selectCategory">
              <option value="All">All Categories</option>
              <option value="Number & Pattern Reasoning">Number & Pattern Reasoning</option>
              <option value="Verbal Reasoning">Verbal Reasoning</option>
              <option value="Logical Reasoning">Logical Reasoning</option>
              <option value="Non-Verbal Reasoning">Non-Verbal Reasoning</option>
              <option value="Spatial Reasoning">Spatial Reasoning</option>
              <option value="Arrangement & Puzzle Reasoning">Arrangement & Puzzles</option>
            </select>
          </div>

          <div class="config-option">
            <label for="selectDifficulty">Difficulty</label>
            <select id="selectDifficulty">
              <option value="Mixed">Mixed (All Levels)</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
              <option value="Expert">Expert</option>
            </select>
          </div>

          <div class="config-option">
            <label for="selectCount">Number of Questions</label>
            <select id="selectCount">
              <option value="5">5 Questions</option>
              <option value="10" selected>10 Questions</option>
              <option value="15">15 Questions</option>
              <option value="20">20 Questions</option>
            </select>
          </div>

          <div id="configMessage"></div>

          <button class="btn btn-primary btn-lg btn-block mt-16" id="startQuizBtn">Start Quiz</button>
        </div>
      </div>

      <!-- Quiz Player Screen -->
      <div id="quizPlayer" class="quiz-player hidden">
        <div class="quiz-header">
          <div>
            <span class="question-counter" id="questionCounter">Question 1 of 10</span>
            <span class="difficulty-badge" id="questionDifficulty"></span>
          </div>
          <div class="quiz-score">Score: <span id="currentScore">0</span></div>
          <div class="quiz-timer" id="quizTimer">
            <span>&#9201;</span>
            <span id="timerDisplay">0:00</span>
          </div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="question-card">
          <div class="question-text" id="questionText"></div>
          <div class="question-image hidden" id="questionImage">
            <img id="questionImg" src="" alt="Question image">
          </div>
          <button class="hint-toggle hidden" id="hintToggle">&#128161; Show Hint</button>
          <div class="question-hint hidden" id="questionHint">
            <strong>Hint:</strong> <span id="hintText"></span>
          </div>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="quiz-feedback" id="quizFeedback">
          <div id="feedbackText"></div>
          <div class="explanation" id="feedbackExplanation"></div>
        </div>

        <div class="quiz-actions">
          <button class="btn btn-primary btn-lg hidden" id="nextBtn">Next Question &#10132;</button>
        </div>
      </div>
    </div>
  </main>
